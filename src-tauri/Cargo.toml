[package]
name = "boldo-atlas"
version = "0.1.0"
description = "Organigrama, procesos y fichas de trabajadores, local y portable"
authors = ["Michael Jim Scott Bravo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boldo_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: el icono de la bandeja con el menú (src/features/actualizaciones/bandeja.ts)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ya lo usa Tauri: la carpeta de datos del usuario en cada sistema, antes de crear la app
dirs = "7"
rusqlite = { version = "0.41.0", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v7"] }
# Actualizador (src/actualizar.rs). Salvo el plugin, todas ya las trae tauri-plugin-updater, con las mismas
# opciones: reqwest + rustls (ring) para leer la lista de releases, zip (con deflate) para la portable de
# Windows, futures-util para cancelar la descarga.
tauri-plugin-updater = "2"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# solo para darle a zip el descompresor de flate2 en Rust (miniz_oxide); en Windows nadie más lo elige
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
# abrir la app ya abierta trae su ventana al frente (lib.rs)
tauri-plugin-single-instance = "2"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
tauri-plugin-dialog = "2"
getrandom = "0.4"

# inicio con el sistema (src/inicio.rs); misma versión que ya trae hyper-util
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

# Linux: probar si está libayatana-appindicator3 antes de crear la bandeja (actualizar::bandeja_disponible)
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Portable de prueba de los PR (scripts/release.mjs --perfil prueba): como release pero sin LTO
# y con más paralelismo; compila mucho más rápido. Los releases publicados usan [profile.release].
[profile.prueba]
inherits = "release"
lto = false
codegen-units = 16

# sin optimizar, cada derivación de Argon2id tarda segundos y las pruebas de .boldo hacen decenas
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
