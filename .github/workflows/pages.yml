name: pages

# Construye el sitio (site/, VitePress) y lo publica en GitHub Pages: https://mscottb.github.io/BoldoAtlas/
# - push a main con cambios en el sitio, en el manual (ayuda/, que el sitio publica sin duplicarlo) o en las
#   capturas que usa (docs/capturas/) o en las reglas de markdown que comparte con la app
#   (src/lib/markdownAyuda.ts): construye y publica;
# - pull_request con los mismos cambios: solo construye (npm run build falla con enlaces muertos o errores de
#   plantilla), no sube el artefacto ni despliega;
# - a mano (workflow_dispatch).
# Sin disparo en «release publicado» (el spec §14 lo menciona): las releases de release.yml las crea el GITHUB_TOKEN
# y no disparan otros workflows, y una publicada a mano correría con la ref de la etiqueta (árbol viejo, y el entorno
# github-pages la rechaza). El número de versión de Descargas lo consulta el navegador a la API de GitHub.
# Un cambio solo en site/ no publica una versión de la app: publicar.yml ignora site/** (ayuda/** sí la publica,
# porque el manual va dentro de la app).
# Requiere que el autor active Settings → Pages → Source: GitHub Actions. Mientras no esté activo, el job
# «desplegar» se omite con un aviso (no falla); el sitio queda construido y se publica en la siguiente ejecución.
on:
  push:
    branches: [main]
    paths: ["site/**", "ayuda/**", "docs/capturas/**", "src/lib/markdownAyuda.ts", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "ayuda/**", "docs/capturas/**", "src/lib/markdownAyuda.ts", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# un despliegue a la vez; el que está en curso termina (no se corta a medias). Los PR van en su propio grupo
# para no desplazar un despliegue pendiente.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Acciones fijadas por SHA de commit (la versión va en el comentario): una etiqueta movida no cambia lo que corre.
# upload-pages-artifact v4+ deja fuera los archivos ocultos (.algo); el sitio de VitePress no los usa.
jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # solo para saber si Pages está activado
    outputs:
      pages: ${{ steps.pages.outputs.activado }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      # vitepress build falla con enlaces rotos; antes copia ayuda/ y las capturas (scripts/sync.mjs)
      - run: npm run build
        working-directory: site
      - id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tipo=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>&1); then
            if [ "$tipo" = "workflow" ]; then echo "activado=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::warning title=GitHub Pages no usa GitHub Actions::La fuente actual es '$tipo'. Cambia Settings → Pages → Source a «GitHub Actions» para publicar el sitio."
          elif grep -q "404" <<<"$tipo"; then
            echo "::warning title=GitHub Pages no está activado::Activa Settings → Pages → Source: GitHub Actions y vuelve a ejecutar este workflow (Run workflow) para publicar el sitio."
          else
            # error distinto (red, permisos): se intenta desplegar igual y el paso de despliegue dirá el motivo
            echo "activado=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "activado=false" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request' && steps.pages.outputs.activado == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  desplegar:
    needs: construir
    if: github.event_name != 'pull_request' && needs.construir.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
