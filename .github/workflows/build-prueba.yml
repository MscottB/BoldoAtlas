name: build-prueba

# Portable de prueba en cada PR, descargable desde la pestaña Actions (artefacto privado al repo, sin
# release pública). Solo portable y con el perfil Cargo `prueba` (sin LTO): lint y tests los corre ci.yml.
# En main no sube nada: compila para dejar la caché de Rust caliente para los PR.
on:
  pull_request:
    paths-ignore: ["site/**", "docs/**", "*.md", ".github/*.md"]
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "*.md", ".github/*.md"]
  workflow_dispatch:

concurrency:
  group: build-prueba-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # etiquetas para calcular la versión
      - uses: ./.github/actions/preparar-node
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: boldo-prueba
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # en un PR: la versión que tendrá al fusionarse, con el número del PR (p. ej. 0.1.0-alpha.3+pr4)
      - id: v
        run: node scripts/publicacion.mjs "$GITHUB_EVENT_PATH"
        shell: bash
      - run: node scripts/release.mjs --solo-portable --perfil prueba
        env:
          BOLDO_VERSION: ${{ steps.v.outputs.version_prueba }}
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: BoldoAtlas_${{ steps.v.outputs.version_prueba || github.sha }}_portable
          path: release/*/*
          retention-days: 14
          if-no-files-found: error
