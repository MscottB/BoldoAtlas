name: ci

# ayuda/**/*.md va dentro de la app: solo se ignoran los .md de la raíz y de .github
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "*.md", ".github/*.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "*.md", ".github/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      - uses: ./.github/actions/preparar-node
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
