name: ci-rust

on:
  push:
    branches: [main]
    paths: ["src-tauri/**", ".github/workflows/ci-rust.yml", ".github/actions/preparar-rust/**"]
  pull_request:
    paths: ["src-tauri/**", ".github/workflows/ci-rust.yml", ".github/actions/preparar-rust/**"]

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    # los tres sistemas: rutas.rs tiene lógica propia de cada uno (portable junto al AppImage o al .app)
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      # Cachés de Rust: una por perfil Cargo (boldo-debug, boldo-prueba, boldo-release) y por SO, compartidas
      # por todos los workflows y guardadas solo desde main (ver .github/actions/preparar-rust).
      - uses: ./.github/actions/preparar-rust
        with:
          cache: boldo-debug
          componentes: clippy, rustfmt
      # generate_context! exige que exista la carpeta del frontend compilado
      - run: mkdir dist
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
