name: publicar

# Cada PR fusionado a main es una versión: calcula la siguiente (scripts/publicacion.mjs), y release.yml
# crea la etiqueta anotada, compila y publica la prerelease con las notas de todos los PR fusionados
# desde la última etiqueta (así no se pierden las de un run cancelado o fallido).
# Un push a main que no viene de un PR, o que solo toca documentación o CI (.github/**), no publica
# nada; esos cambios salen en el siguiente release. workflow_dispatch es un ensayo: muestra versión y
# notas sin etiquetar ni publicar.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "*.md", ".github/**", ".gitignore"]
  workflow_dispatch:
    inputs:
      pr:
        description: "Número de PR a ensayar (vacío: el PR fusionado en este commit)"
        required: false
        default: ""

permissions:
  contents: read

# un release a la vez, en orden: el siguiente calcula su versión con la etiqueta del anterior ya creada.
# Los ensayos van en otro grupo para no cancelar nunca un release pendiente.
concurrency:
  group: publicar-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publicar: ${{ steps.v.outputs.publicar }}
      etiqueta: ${{ steps.v.outputs.etiqueta }}
      notas: ${{ steps.v.outputs.notas }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # etiquetas
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # sin caché automática de npm
      # PR del asunto del merge (o de la API) más los fusionados desde la última etiqueta. Falla si un
      # asunto dice que es un PR y no se puede leer; no publica si el commit ya tiene etiqueta.
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: node scripts/publicacion.mjs --publicar ${PR:+"$PR"}
      - name: Resumen
        env:
          PUBLICAR: ${{ steps.v.outputs.publicar }}
          ETIQUETA: ${{ steps.v.outputs.etiqueta }}
          PR: ${{ steps.v.outputs.pr }}
          NOTAS: ${{ steps.v.outputs.notas }}
          ENSAYO: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          {
            if [ "$PUBLICAR" != "true" ]; then
              echo "Este commit no viene de un PR fusionado, o ya está publicado: no se publica nada."
            else
              [ "$ENSAYO" = "true" ] && echo "**Ensayo:** no se etiqueta ni se publica."
              echo "Se publica **$ETIQUETA** con los PR $PR."
              echo
              echo "### Notas de la versión"
              echo
              echo "$NOTAS"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.publicar == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.etiqueta }}
      notes: ${{ needs.version.outputs.notas }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
    # solo para firmar latest.json en el job que publica (release.yml)
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
