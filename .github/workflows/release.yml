name: release

# Release de Windows, Linux y macOS, cada uno con instalador y zip portable, más un SHA256SUMS.txt único
# que cubre todos los archivos (spec §14). Dos caminos:
# - publicar.yml lo llama al fusionar un PR (workflow_call): crea la etiqueta anotada y usa las notas del PR;
# - a mano, empujando una etiqueta vX.Y.Z. Las etiquetas que crea el GITHUB_TOKEN no disparan este
#   camino, por eso publicar.yml lo llama como workflow reutilizable.
# Los checks del frontend corren una vez antes de compilar; cargo test corre en los tres SO en paralelo a los
# builds. No se publica nada si algún job falla.
# Actualizador (spec §12): novedades.json sale de las notas de los releases y viaja dentro de la app y en el
# release; el job que publica firma los paquetes del actualizador con la clave del autor (solo ahí se usan los
# secretos) y arma latest.json. Sin clave, o con una firma que no verifica, el release falla.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      notes:
        type: string
        required: false
        default: ""
      prerelease:
        type: boolean
        required: false
        default: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ETIQUETA: ${{ inputs.tag || github.ref_name }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      - uses: ./.github/actions/preparar-node
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # notas de todas las versiones publicadas más las de esta; las usan los builds y el release
      - name: Novedades
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notes }}
        run: node scripts/novedades.mjs --etiqueta "$ETIQUETA" --salida novedades.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novedades-${{ env.ETIQUETA }}
          path: novedades.json
          retention-days: 7
          if-no-files-found: error

  pruebas-rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      - uses: ./.github/actions/preparar-rust
        with:
          cache: boldo-debug # la de ci-rust
      # generate_context! exige que exista la carpeta del frontend compilado
      - run: mkdir dist
      - run: cargo test
        working-directory: src-tauri

  compilar:
    needs: verificar
    strategy:
      # sin fail-fast: si un sistema falla, los otros terminan y se ve cuál fue
      fail-fast: false
      matrix:
        include:
          - sistema: windows
            runner: windows-latest
            herramientas: ~\AppData\Local\tauri # NSIS y nsis_tauri_utils
          - sistema: linux
            runner: ubuntu-22.04 # glibc antigua: el AppImage abre en más distribuciones
            herramientas: ~/.cache/tauri # linuxdeploy y sus plugins para el AppImage
          - sistema: macos
            runner: macos-latest
            objetivos: aarch64-apple-darwin,x86_64-apple-darwin # binario universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe necesita historia y etiquetas
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      - uses: ./.github/actions/preparar-node
      - uses: ./.github/actions/preparar-rust
        with:
          cache: boldo-release
          objetivos: ${{ matrix.objetivos }}
      # lo que el bundler de Tauri descarga al empaquetar (macOS no descarga nada)
      - if: matrix.herramientas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.herramientas }}
          key: tauri-herramientas-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-herramientas-${{ runner.os }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: novedades-${{ env.ETIQUETA }}
          path: src-tauri/target
      # mismo comando que `npm run release` en local; falla si la versión no coincide con la etiqueta.
      # Desde publicar.yml la etiqueta aún no existe: BOLDO_VERSION impone la versión.
      - run: node scripts/release.mjs --etiqueta "$ETIQUETA"
        shell: bash
        env:
          BOLDO_VERSION: ${{ inputs.tag }}
          BOLDO_NOVEDADES: ${{ github.workspace }}/src-tauri/target/novedades.json # el diálogo «Novedades»
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.ETIQUETA }}-${{ matrix.sistema }}
          path: release/*/*
          retention-days: 7
          if-no-files-found: error

  # Listas de componentes (SBOM). Job aparte, sin secretos ni permiso de escritura: cargo-cyclonedx nunca corre junto
  # a la clave. Su artefacto calza con el patrón de los sistemas, así que entra a salida/, a SHA256SUMS.txt y al release
  # sin tocar la firma ni latest.json.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no hace push: el token no queda en el disco del runner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # sin caché automática de npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: node scripts/sbom.mjs sbom "$ETIQUETA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.ETIQUETA }}-sbom
          path: sbom/*
          retention-days: 7
          if-no-files-found: error

  publicar:
    needs: [verificar, pruebas-rust, compilar, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # etiquetas, para ver si este commit ya está publicado
          persist-credentials: true # único job que hace push (la etiqueta anotada): usa el GITHUB_TOKEN del job
      # node_modules: la CLI de Tauri firma los paquetes del actualizador
      - uses: ./.github/actions/preparar-node
      # un artefacto por sistema, cada uno en su subcarpeta (salida/release-<etiqueta>-<sistema>/<versión>/)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-${{ env.ETIQUETA }}-*
          path: salida
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: novedades-${{ env.ETIQUETA }}
          path: salida
      # Firma cada paquete del actualizador, verifica cada firma contra la clave pública de tauri.conf.json y
      # escribe salida/latest.json. Falla (y no se publica nada) si falta la clave o una firma no verifica.
      - name: Firmar el actualizador (latest.json)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/manifiesto.mjs salida "$ETIQUETA" && cat salida/latest.json
      # un solo SHA256SUMS.txt con los archivos de los tres sistemas; falla si dos se llaman igual
      - run: node scripts/release.mjs --sumas salida && cat salida/SHA256SUMS.txt
      # Solo desde publicar.yml. Nunca publica código viejo con una etiqueta existente o más nueva
      # (p. ej. al reintentar un run antiguo): la etiqueta, si existe, debe apuntar a este mismo commit.
      - name: Etiqueta anotada
        if: inputs.tag
        run: |
          # anotada: la última línea es el commit (^{}); ligera: una sola línea
          destino=$(git ls-remote origin "refs/tags/$ETIQUETA" "refs/tags/$ETIQUETA^{}" | tail -n 1 | cut -f 1)
          if [ -n "$destino" ]; then
            if [ "$destino" != "$GITHUB_SHA" ]; then
              echo "::error::$ETIQUETA ya existe en $destino, no en $GITHUB_SHA: no se publica."
              exit 1
            fi
            echo "La etiqueta $ETIQUETA ya apunta a este commit (reintento); se reutiliza."
          else
            publicada=$(git tag --contains "$GITHUB_SHA" --list 'v*')
            if [ -n "$publicada" ]; then
              echo "::error::$GITHUB_SHA ya está publicado en $publicada: no se publica como $ETIQUETA."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$ETIQUETA" -m "BoldoAtlas $ETIQUETA" "$GITHUB_SHA"
            git push origin "refs/tags/$ETIQUETA"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.ETIQUETA }}
          name: BoldoAtlas ${{ env.ETIQUETA }}
          # los archivos están en subcarpetas (sistema y versión); sin archivos, falla en vez de publicar vacío
          files: salida/**/*
          fail_on_unmatched_files: true
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ !inputs.tag }}
          prerelease: ${{ inputs.tag && inputs.prerelease || !inputs.tag && contains(github.ref_name, '-') }}
