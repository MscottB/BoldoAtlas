name: preparar-node
description: Node 24 y node_modules en caché por package-lock.json (npm ci solo si cambió).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false # sin caché automática de npm: node_modules se cachea abajo
    - id: modulos
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
    - if: steps.modulos.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
